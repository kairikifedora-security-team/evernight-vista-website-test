<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Evernight Vista · 更新日记</title>
  <link rel="icon" type="image/png" href="https://gh-proxy.org/https://github.com/EvernightFedora/evernight-vista/blob/main/system-logo-white.png">
  <!-- 引入 MiSans 字体 -->
  <style>
    @import url('https://cdn.jsdelivr.net/npm/misans@4.0.0/lib/Normal/MiSans-Normal.min.css');
  </style>
  <style>
    :root {
      --bg-deep: #080b12;
      --card-bg: #0f131e;
      --text-primary: #e8edf5;
      --text-secondary: #9aa4bf;
      --accent: #7b9fff;
      --accent-soft: rgba(123, 159, 255, 0.18);
      --border-card: rgba(255, 255, 255, 0.07);
      --shadow-glow: 0 0 60px rgba(123, 159, 255, 0.25);
      --radius-xl: 22px;
      --radius-md: 12px;
      --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "MiSans", "Inter", "PingFang SC", "Noto Sans JP", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star-dot {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: starPulse var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }

    @keyframes starPulse {
      0%, 100% { opacity: 0.1; transform: scale(0.7); }
      40% { opacity: 0.8; transform: scale(1.6); }
      70% { opacity: 0.25; transform: scale(1); }
    }

    .wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 640px;
      margin: 24px;
    }

    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 16px;
      padding-right: 8px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      transition: all var(--transition);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(20, 24, 35, 0.55);
    }

    .lang-btn:hover {
      background: rgba(123, 159, 255, 0.14);
      border-color: rgba(123, 159, 255, 0.4);
      color: #dfe6ff;
    }

    .lang-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 14px rgba(123, 159, 255, 0.35);
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-xl);
      padding: 48px 44px 52px;
      box-shadow: var(--shadow-glow), 0 12px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 90px;
      background: radial-gradient(ellipse, rgba(123, 159, 255, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .icon {
      margin-bottom: 26px;
      display: flex;
      justify-content: center;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: rgba(18, 24, 42, 0.7);
      padding: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: white;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .sub {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      margin-bottom: 36px;
    }

    .versions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .ver-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      padding: 18px 26px;
      text-decoration: none;
      color: #d0d8f0;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all var(--transition);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      flex-wrap: wrap;
    }

    .ver-num {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", monospace;
      font-weight: 700;
      color: #b8ccff;
      letter-spacing: 0.04em;
    }

    .arrow {
      width: 18px;
      height: 18px;
      margin-left: 2px;
      transition: transform var(--transition);
    }

    .arrow svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .ver-link:hover {
      background: rgba(123, 159, 255, 0.08);
      border-color: rgba(123, 159, 255, 0.45);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(123, 159, 255, 0.2);
    }

    .ver-link:hover .arrow {
      transform: translateX(4px);
    }

    .footer-note {
      margin-top: 36px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      opacity: 0.7;
      letter-spacing: 0.03em;
    }

    @media (max-width: 520px) {
      .card {
        padding: 36px 22px 42px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .lang-btn {
        padding: 4px 12px;
        font-size: 0.78rem;
      }
      .ver-link {
        font-size: 0.95rem;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="starsContainer"></div>

  <div class="wrapper">
    <div class="lang-bar">
      <button class="lang-btn" data-lang="zh">中</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
    </div>

    <div class="card">
      <div class="icon">
        <img src="https://gh-proxy.org/https://github.com/EvernightFedora/evernight-vista/blob/main/system-logo-white.png" alt="Evernight Vista Logo" class="logo-img">
      </div>

      <h1 data-i18n="title">Evernight Vista 更新日记</h1>
      <p class="sub" data-i18n="subtitle">Update Diary</p>

      <div class="versions">
        <!-- 动态跳转链接：根据当前语言自动指向对应更新日记 HTML -->
        <a href="44-0-1-released-en.html" class="ver-link" id="versionLink">
          <span>Evernight Vista</span>
          <span class="ver-num">44.0.1</span>
          <span class="arrow">
            <svg viewBox="0 0 24 24"><polyline points="7 4 16 12 7 20" /></svg>
          </span>
        </a>
      </div>

      <p class="footer-note" data-i18n="footer">选择版本以查看详细更新内容</p>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 星空背景 ----------
      const starsContainer = document.getElementById('starsContainer');
      const starCount = 100;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < starCount; i++) {
        const dot = document.createElement('div');
        dot.className = 'star-dot';
        const size = Math.random() * 2.3 + 0.7;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.setProperty('--dur', (Math.random() * 3.5 + 2.2) + 's');
        dot.style.setProperty('--delay', (Math.random() * 5.5) + 's');
        if (Math.random() < 0.22) {
          dot.style.background = '#b8ccff';
          dot.style.boxShadow = '0 0 5px #7b9fff';
        }
        frag.appendChild(dot);
      }
      starsContainer.appendChild(frag);

      // ---------- 多语言数据 ----------
      const translations = {
        zh: {
          title: 'Evernight Vista 更新日记',
          subtitle: 'Update Diary',
          footer: '选择版本以查看详细更新内容'
        },
        en: {
          title: 'Evernight Vista Update Diary',
          subtitle: 'Update Diary',
          footer: 'Select a version to view detailed update notes'
        },
        ja: {
          title: 'Evernight Vista アップデートダイアリー',
          subtitle: 'アップデートダイアリー',
          footer: 'バージョンを選択して詳細な更新内容をご確認ください'
        }
      };

      // 根据语言返回对应的更新日记页面路径
      function getReleaseNotesPath(lang) {
        if (lang === 'zh') {
          return '44-0-1-released-zh-cn.html';
        } else {
          // en 或 ja（无日文版，回退英文）
          return '44-0-1-released-en.html';
        }
      }

      const langButtons = document.querySelectorAll('.lang-btn');
      const i18nElements = document.querySelectorAll('[data-i18n]');
      const versionLink = document.getElementById('versionLink');

      // ---------- 获取初始语言 ----------
      function getInitialLang() {
        const saved = localStorage.getItem('ev-lang');
        if (saved && translations[saved]) return saved;
        const browserLang = (navigator.language || navigator.userLanguage || '').slice(0, 2);
        if (browserLang === 'ja') return 'ja';
        if (browserLang === 'en') return 'en';
        if (browserLang === 'zh') return 'zh';
        return 'zh'; // 默认中文
      }

      // ---------- 应用语言 ----------
      function applyLanguage(lang) {
        // 更新文本内容
        i18nElements.forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (key && translations[lang]?.[key]) {
            el.textContent = translations[lang][key];
          }
        });

        // 更新版本按钮的跳转链接
        versionLink.href = getReleaseNotesPath(lang);

        // 高亮当前语言按钮
        langButtons.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });

        // 保存用户偏好
        localStorage.setItem('ev-lang', lang);
        document.documentElement.setAttribute('lang', lang);
      }

      // ---------- 绑定语言切换事件 ----------
      langButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          if (lang) applyLanguage(lang);
        });
      });

      // ---------- 初始化（自动检测浏览器语言） ----------
      applyLanguage(getInitialLang());
    })();
  </script>
</body>
</html>
